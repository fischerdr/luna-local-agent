<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna</title>
<style>
  :root { --bg-top: #22142f; --bg-bottom: #0b0711; --text: #d9d4ec; --dim: #8880a8; --accent: #e07ac8; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 50% 20%, var(--bg-top), var(--bg-bottom));
         color: var(--text); font: 12px/1.4 system-ui, sans-serif; }
  body.transparent { background: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #note { position: fixed; inset: auto 0 12px 0; text-align: center; color: var(--dim);
          pointer-events: none; transition: opacity .6s; }
  #note.hidden { opacity: 0; }
  #touchtip { position: fixed; pointer-events: none; color: var(--accent); font-weight: 600;
              text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #debug { position: fixed; top: 8px; left: 8px; width: 360px; height: 60vh; min-width: 180px; min-height: 80px;
           max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; resize: both;
           background: #120d1ccc; border: 1px solid #3a2d55; border-radius: 8px; padding: 0 10px 8px;
           display: none; box-sizing: border-box; }
  #dbar { position: sticky; top: 0; margin: 0 -10px; padding: 6px 10px; background: #1a1328; cursor: move;
          user-select: none; border-bottom: 1px solid #3a2d55; z-index: 1; }
  #dbar .hint { float: right; color: var(--dim); }
  #debug details > summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 8px 0 2px; }
  body.debug #debug { display: block; }
  #debug button { background: #2a2040; color: var(--text); border: 1px solid #4a3a70;
                  border-radius: 6px; padding: 3px 8px; margin: 2px; cursor: pointer; font: inherit; }
  #debug button:hover { border-color: var(--accent); }
  #debug pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--dim); }
  #debug .dim { color: var(--dim); margin: 2px 0; }
  #debug h4 { margin: 8px 0 2px; color: var(--accent); font-weight: 600; }
  #debug input[type=range] { accent-color: var(--accent); vertical-align: middle; }
  #debug input[type=number] { background: #2a2040; color: var(--text); border: 1px solid #4a3a70;
                              border-radius: 4px; font: inherit; padding: 1px 4px; }
  #debug select { background: #2a2040; color: var(--text); border: 1px solid #4a3a70; border-radius: 6px; font: inherit; max-width: 100%; }
</style>
</head>
<body>
<div id="note">loading…</div>
<div id="debug">
  <div id="dbar"><b>portrait debug</b> - <span id="dstate"></span>
    <span class="hint">drag here · corner resizes · h hides</span></div>
  <h4>model</h4><select id="dmodel"></select>
  <h4>view</h4><div id="dview"></div>
  <div class="dim">left-drag turns her · wheel zooms · double-click resets</div>
  <h4>try</h4>
  <div id="dbuttons"></div>
  <h4>clips</h4><div id="dclips"><span class="dim">none in portrait/animations</span></div>
  <h4>tune</h4><div id="dtune"></div>
  <details data-key="ears"><summary>ears</summary><pre id="dears"></pre></details>
  <details data-key="expr"><summary>expressions</summary><pre id="dexpr"></pre></details>
  <details data-key="bones"><summary>bones that might be ears or hair</summary><pre id="dbones"></pre></details>
</div>
<script type="module" src="./boot.js"></script>
</body>
</html>
